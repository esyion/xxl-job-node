server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA（hash 路由下非必需，保留以兼容 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理 API 与 executor 协议统一转发到调度中心
    location /api/ {
        proxy_pass http://admin:8989;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
